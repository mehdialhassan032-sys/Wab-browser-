<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Time Dashboard - Final Pixel Exact UI</title>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #d1d5db;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
      margin: 0;
    }

    /* PHONE CONTAINER - EXACT NATIVE METRICS */
    .phone-screen {
      width: 360px;
      background: #ffffff;
      padding: 20px 20px 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      box-sizing: border-box;
      color: #1f1f1f;
      position: relative;
    }

    /* TOP NAVIGATION */
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      fill: #1f1f1f;
      cursor: pointer;
    }

    #titleText {
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 20px;
      color: #1f1f1f;
      line-height: 1.2;
    }

    .center-info {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      background: #e8f0fe;
      color: #1967d2;
      padding: 5px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      display: inline-block;
      margin-bottom: 10px;
    }

    #timeText {
      font-size: 40px;
      font-weight: 300;
      letter-spacing: -0.5px;
      color: #1f1f1f;
      line-height: 1.1;
      margin: 2px 0;
    }

    .sub-title {
      font-size: 13px;
      color: #5f6368;
      margin-top: 2px;
    }

    /* GRAPH CONTAINER */
    .chart-container {
      position: relative;
      height: 110px;
      margin: 18px 0;
      display: flex;
    }

    .chart-grid-lines {
      position: absolute;
      top: 0; left: 0; right: 28px; bottom: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
    }

    .grid-line {
      width: 100%;
      height: 1px;
      background-color: #ededed;
    }

    .chart-grid {
      width: 100%;
      height: 92px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 30px;
      z-index: 2;
      position: relative;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 10%;
      height: 100%;
      justify-content: flex-end;
      position: relative;
    }

    .bar {
      width: 100%;
      background-color: #c4d9ff;
      border-radius: 2px 2px 0 0;
    }

    .bar.active {
      background-color: #1967d2;
    }

    .bar-day {
      font-size: 10px;
      color: #5f6368;
      position: absolute;
      bottom: -18px;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 9px;
      color: #70757a;
      position: absolute;
      right: 0; top: -3px; bottom: 18px;
      text-align: right;
    }

    .date-selector {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin: 22px 16px 20px 16px;
      color: #3c4043;
    }

    /* LIST DENSITY FIXED */
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-icon-frame {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      overflow: hidden;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .app-icon {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-name {
      font-size: 14.5px;
      font-weight: 400;
      color: #202124;
    }

    .app-time {
      font-size: 12px;
      color: #5f6368;
      margin-top: 1px;
    }

    .app-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background-color: #eaeaea;
    }

    .hourglass-icon {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: #5f6368;
      stroke-width: 1.8;
    }

    [contenteditable="true"] { outline: none; }
    [contenteditable="true"]:focus { background-color: #eef4ff; border-radius: 2px; }

    /* CONTROLS */
    .controls-panel {
      margin-top: 20px;
      width: 360px;
      background: #ffffff;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
    }

    .slider-row input[type="range"] { width: 140px; }

    .btn {
      background: #1967d2;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add { background: #1e8e3e; }
    .btn-crop { background: #f9ab00; color: #000; padding: 6px 12px; font-size: 12px; }

    .graph-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }
    .graph-controls input { width: 38px; }

    .upload-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
    }

    .crop-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
    }
    .crop-container { max-width: 90%; max-height: 65vh; background: #000; }
  </style>
</head>
<body>

  <!-- MOBILE SCREEN CONTAINER -->
  <div class="phone-screen" id="captureArea">
    
    <div class="header-nav">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </div>

    <div id="titleText" contenteditable="true">App activity details</div>

    <div class="center-info">
      <div class="badge" contenteditable="true">Screen time ▼</div>
      <div id="timeText" contenteditable="true">6 hr, 59 min</div>
      <div class="sub-title" contenteditable="true">Today</div>
    </div>

    <div class="chart-container">
      <div class="chart-grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
      </div>

      <div class="chart-grid">
        <div class="bar-col"><div class="bar" id="bar-sun" style="height: 95.3%;"></div><span class="bar-day" contenteditable="true">Sun</span></div>
        <div class="bar-col"><div class="bar active" id="bar-mon" style="height: 48%;"></div><span class="bar-day" contenteditable="true">Mon</span></div>
        <div class="bar-col"><div class="bar" id="bar-tue" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Tue</span></div>
        <div class="bar-col"><div class="bar" id="bar-wed" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Wed</span></div>
        <div class="bar-col"><div class="bar" id="bar-thu" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Thu</span></div>
        <div class="bar-col"><div class="bar" id="bar-fri" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Fri</span></div>
        <div class="bar-col"><div class="bar" id="bar-sat" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Sat</span></div>
      </div>

      <div class="y-axis">
        <span>15h</span>
        <span>12h</span>
        <span>9h</span>
        <span>6h</span>
        <span>3h</span>
        <span>0h</span>
      </div>
    </div>

    <div class="date-selector">
      <span contenteditable="true">‹</span>
      <span contenteditable="true">Mon, Aug 17</span>
      <span contenteditable="true">›</span>
    </div>

    <div class="app-list" id="appList">
      <div class="app-item">
        <div class="app-left">
          <div class="app-icon-frame">
            <img class="app-icon" id="img-0" src="https://unavatar.io/instagram.com" alt="icon">
          </div>
          <div>
            <div class="app-name" contenteditable="true">Instagram</div>
            <div class="app-time" contenteditable="true">1 hr, 46 min</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24"><path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTROL DASHBOARD -->
  <div class="controls-panel">
    <strong>Font Size Adjuster</strong>
    <div class="slider-row">
      <span>Title: <b id="titleVal">22px</b></span>
      <input type="range" min="16" max="40" value="22" oninput="changeFontSize('titleText', this.value, 'titleVal')">
    </div>
    <div class="slider-row">
      <span>Time: <b id="timeVal">40px</b></span>
      <input type="range" min="20" max="60" value="40" oninput="changeFontSize('timeText', this.value, 'timeVal')">
    </div>

    <hr style="margin: 12px 0;">

    <strong>Bar Heights (0h to 15h)</strong>
    <div class="graph-controls">
      <span>Sun: <input type="number" step="0.5" max="15" min="0" value="14.3" onchange="adjustBarByHours('bar-sun', this.value)">h</span>
      <span>Mon: <input type="number" step="0.5" max="15" min="0" value="7.2" onchange="adjustBarByHours('bar-mon', this.value)">h</span>
      <span>Tue: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-tue', this.value)">h</span>
      <span>Wed: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-wed', this.value)">h</span>
      <span>Thu: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-thu', this.value)">h</span>
      <span>Fri: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-fri', this.value)">h</span>
      <span>Sat: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-sat', this.value)">h</span>
    </div>

    <hr style="margin: 12px 0;">

    <strong>Logo Uploads</strong>
    <div id="uploadList">
      <div class="upload-row">
        <span>App 1 Logo:</span>
        <input type="file" accept="image/*" onchange="handleImageProcessing(event, 'img-0')">
      </div>
    </div>

    <hr style="margin: 12px 0;">

    <div style="display: flex; gap: 8px;">
      <button class="btn btn-add" onclick="addNewApp()">+ Add App</button>
      <button class="btn" onclick="exportImage()">Download Screen</button>
    </div>
  </div>

  <!-- CROPPER MODAL -->
  <div class="crop-modal" id="cropModal">
    <div class="crop-container">
      <img id="cropperImage" src="" style="max-width: 100%;">
    </div>
    <div style="margin-top: 15px; display: flex; gap: 10px;">
      <button class="btn btn-crop" onclick="applyManualCrop()">✂ Crop & Apply</button>
      <button class="btn" style="background:#666;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let appCount = 1;
    let cropper = null;
    let activeTargetImgId = null;

    function changeFontSize(elementId, size, displayId) {
      const el = document.getElementById(elementId);
      if(el) {
        el.style.fontSize = size + 'px';
        document.getElementById(displayId).innerText = size + 'px';
      }
    }

    function adjustBarByHours(barId, hoursVal) {
      let hours = parseFloat(hoursVal);
      if (isNaN(hours)) hours = 0;
      if (hours > 15) hours = 15;
      document.getElementById(barId).style.height = ((hours / 15) * 100) + '%';
    }

    function handleImageProcessing(event, targetImgId) {
      const file = event.target.files[0];
      if (!file) return;
      activeTargetImgId = targetImgId;
      openCropperModal(file);
    }

    function openCropperModal(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const modal = document.getElementById('cropModal');
        const cropperImg = document.getElementById('cropperImage');
        cropperImg.src = e.target.result;
        modal.style.display = 'flex';

        if(cropper) cropper.destroy();
        cropper = new Cropper(cropperImg, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.8 });
      };
      reader.readAsDataURL(file);
    }

    function applyManualCrop() {
      if(!cropper) return;
      const canvas = cropper.getCroppedCanvas({ width: 128, height: 128 });
      document.getElementById(activeTargetImgId).src = canvas.toDataURL('image/png');
      closeModal();
    }

    function closeModal() {
      document.getElementById('cropModal').style.display = 'none';
      if(cropper) cropper.destroy();
    }

    function addNewApp() {
      const currentId = appCount++;
      const container = document.getElementById('appList');
      const div = document.createElement('div');
      div.className = 'app-item';
      div.innerHTML = `
        <div class="app-left">
          <div class="app-icon-frame">
            <img class="app-icon" id="img-${currentId}" src="https://unavatar.io/google.com" alt="icon">
          </div>
          <div>
            <div class="app-name" contenteditable="true">App Name</div>
            <div class="app-time" contenteditable="true">0 min</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24"><path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/></svg>
        </div>
      `;
      container.appendChild(div);

      const uploadContainer = document.getElementById('uploadList');
      const uploadRow = document.createElement('div');
      uploadRow.className = 'upload-row';
      uploadRow.innerHTML = `
        <span>App ${currentId + 1} Logo:</span>
        <input type="file" accept="image/*" onchange="handleImageProcessing(event, 'img-${currentId}')">
      `;
      uploadContainer.appendChild(uploadRow);
    }

    function exportImage() {
      const area = document.getElementById('captureArea');
      html2canvas(area, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'screen-time-dashboard.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
