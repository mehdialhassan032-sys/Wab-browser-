<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Time Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Roboto', -apple-system, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    /* Generator Box (Android Style UI) */
    .phone-screen {
      width: 360px;
      background: #ffffff;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .title { font-size: 22px; font-weight: 500; color: #1f1f1f; margin-bottom: 20px; }
    .badge-container { text-align: center; }
    .badge { background: #e0e7ff; color: #3730a3; padding: 6px 16px; border-radius: 20px; font-size: 14px; display: inline-block; }
    .total-time { font-size: 36px; font-weight: 500; text-align: center; margin: 10px 0 2px 0; }
    .sub-title { font-size: 14px; color: #70757a; text-align: center; margin-bottom: 20px; }
    
    .date-text { text-align: center; font-size: 15px; font-weight: 500; margin-bottom: 15px; }

    /* Dynamic App List */
    .app-list { display: flex; flex-direction: column; gap: 16px; }
    .app-item { display: flex; align-items: center; justify-content: space-between; }
    .app-details { display: flex; align-items: center; gap: 12px; }
    .app-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    
    /* Editable elements styling */
    [contenteditable="true"] { outline: none; border-bottom: 1px dashed transparent; }
    [contenteditable="true"]:hover { border-bottom: 1px dashed #2563eb; }
    [contenteditable="true"]:focus { background-color: #eff6ff; border-bottom: 1px solid #2563eb; }

    /* Action Buttons */
    .controls { margin-top: 20px; display: flex; gap: 10px; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-add { background: #16a34a; }
  </style>
</head>
<body>

  <!-- Screen UI -->
  <div class="phone-screen" id="captureArea">
    <div class="title" contenteditable="true">App activity details</div>
    
    <div class="badge-container">
      <span class="badge" contenteditable="true">Screen time ▼</span>
    </div>
    
    <div class="total-time" contenteditable="true">6 hr, 59 min</div>
    <div class="sub-title" contenteditable="true">Today</div>
    
    <div class="date-text" contenteditable="true">‹ Mon, Aug 17 ›</div>

    <!-- App items with Dynamic Icon Loading -->
    <div class="app-list" id="appList">
      
      <div class="app-item">
        <div class="app-details">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=instagram.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="updateIcon(this)">Instagram</div>
            <div style="font-size: 12px; color: #70757a;" contenteditable="true">1 hr, 46 min</div>
          </div>
        </div>
      </div>

      <div class="app-item">
        <div class="app-details">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="updateIcon(this)">YouTube</div>
            <div style="font-size: 12px; color: #70757a;" contenteditable="true">1 hr, 44 min</div>
          </div>
        </div>
      </div>

      <div class="app-item">
        <div class="app-details">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="updateIcon(this)">Chrome</div>
            <div style="font-size: 12px; color: #70757a;" contenteditable="true">33 minutes</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="controls">
    <button class="btn btn-add" onclick="addAppRow()">+ Add App</button>
    <button class="btn" onclick="downloadPNG()">Download Screenshot</button>
  </div>

  <script>
    // Automatic Icon Update based on App Name
    function updateIcon(element) {
      const appName = element.innerText.trim().toLowerCase().replace(/\s+/g, '');
      const iconImg = element.closest('.app-details').querySelector('.app-icon');
      
      if (appName) {
        // Fetches real-time brand favicons automatically
        iconImg.src = `https://www.google.com/s2/favicons?domain=${appName}.com&sz=64`;
      }
    }

    // Add New App Row Dynamically
    function addAppRow() {
      const appList = document.getElementById('appList');
      const newRow = document.createElement('div');
      newRow.className = 'app-item';
      newRow.innerHTML = `
        <div class="app-details">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=app.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="updateIcon(this)">App Name</div>
            <div style="font-size: 12px; color: #70757a;" contenteditable="true">0 min</div>
          </div>
        </div>
      `;
      appList.appendChild(newRow);
    }

    // Download Canvas as Image
    function downloadPNG() {
      const captureArea = document.getElementById('captureArea');
      html2canvas(captureArea, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'screentime-report.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>

</body>
</html>
