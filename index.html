<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Time Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Roboto', -apple-system, sans-serif;
      background-color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .phone-screen {
      width: 360px;
      background: #fcfcfd;
      padding: 12px 16px 24px 16px;
      border-radius: 0px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      box-sizing: border-box;
      color: #1f1f1f;
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      color: #333;
      margin-bottom: 14px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      margin-bottom: 24px;
    }

    .center-info {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      background: #e5ecff;
      color: #30419b;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      display: inline-block;
      margin-bottom: 16px;
    }

    .total-time {
      font-size: 38px;
      font-weight: 400;
      letter-spacing: -0.5px;
    }

    .sub-title {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .chart-container {
      position: relative;
      height: 120px;
      margin: 20px 0 10px 0;
      display: flex;
    }

    .chart-grid-lines {
      position: absolute;
      top: 0;
      left: 0;
      right: 28px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
    }

    .grid-line {
      width: 100%;
      height: 1px;
      background-color: #ededed;
    }

    .chart-grid {
      width: 100%;
      height: 100px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 32px;
      z-index: 2;
      position: relative;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 10%;
      height: 100%;
      justify-content: flex-end;
      position: relative;
    }

    .bar {
      width: 100%;
      background-color: #d3e2ff;
    }

    .bar.active {
      background-color: #3b73ff;
    }

    .bar-day {
      font-size: 10px;
      color: #555;
      position: absolute;
      bottom: -18px;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 9px;
      color: #777;
      position: absolute;
      right: 0;
      top: -4px;
      bottom: 20px;
      text-align: right;
    }

    .date-selector {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin: 28px 40px 20px 40px;
      color: #333;
    }

    .app-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .app-icon-wrapper {
      position: relative;
      cursor: pointer;
    }

    .app-icon {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 8px;
    }

    .upload-btn-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 34px;
      height: 34px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      color: #fff;
      font-size: 10px;
      text-align: center;
      line-height: 34px;
    }

    .app-icon-wrapper:hover .upload-btn-overlay {
      display: block;
    }

    .app-name {
      font-size: 16px;
      font-weight: 400;
      color: #1a1a1a;
    }

    .app-time {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .app-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .divider {
      width: 1px;
      height: 24px;
      background-color: #e8e8e8;
    }

    .hourglass-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #333333;
      stroke-width: 1.6;
    }

    [contenteditable="true"] { outline: none; }
    [contenteditable="true"]:focus { background-color: #f0f4ff; }

    .controls-panel {
      margin-top: 20px;
      width: 360px;
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .btn {
      background: #3b73ff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add { background: #2e7d32; }

    .graph-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
    }
    .graph-controls input {
      width: 42px;
    }
  </style>
</head>
<body>

  <div class="phone-screen" id="captureArea">
    <div class="status-bar">
      <span contenteditable="true">3:21</span>
      <div class="status-right">
        <span contenteditable="true">VoLTE</span>
        <span contenteditable="true">0.50 KB/s</span>
        <span contenteditable="true">5G</span>
        <span contenteditable="true">◯ 88%</span>
      </div>
    </div>

    <div class="header-nav">
      <span>←</span>
      <span style="font-size: 18px;" contenteditable="true">⋮</span>
    </div>

    <div style="font-size: 24px; font-weight: 400; margin-bottom: 24px;" contenteditable="true">App activity details</div>

    <div class="center-info">
      <div class="badge" contenteditable="true">Screen time ▼</div>
      <div class="total-time" contenteditable="true">14 hr, 21 min</div>
      <div class="sub-title" contenteditable="true">Yesterday</div>
    </div>

    <div class="chart-container">
      <div class="chart-grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
      </div>

      <div class="chart-grid">
        <div class="bar-col"><div class="bar active" id="bar-sun" style="height: 95.3%;"></div><span class="bar-day" contenteditable="true">Sun</span></div>
        <div class="bar-col"><div class="bar" id="bar-mon" style="height: 48%;"></div><span class="bar-day" contenteditable="true">Mon</span></div>
        <div class="bar-col"><div class="bar" id="bar-tue" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Tue</span></div>
        <div class="bar-col"><div class="bar" id="bar-wed" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Wed</span></div>
        <div class="bar-col"><div class="bar" id="bar-thu" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Thu</span></div>
        <div class="bar-col"><div class="bar" id="bar-fri" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Fri</span></div>
        <div class="bar-col"><div class="bar" id="bar-sat" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Sat</span></div>
      </div>

      <div class="y-axis">
        <span>15h</span>
        <span>12h</span>
        <span>9h</span>
        <span>6h</span>
        <span>3h</span>
        <span>0h</span>
      </div>
    </div>

    <div class="date-selector">
      <span>‹</span>
      <span contenteditable="true">Sun, Aug 16</span>
      <span>›</span>
    </div>

    <div class="app-list" id="appList">
      
      <div class="app-item">
        <div class="app-left">
          <div class="app-icon-wrapper" onclick="triggerFileInput(this)" title="Click to Upload Custom Logo">
            <img class="app-icon" src="https://unavatar.io/instagram.com" onerror="fallbackLogo(this, 'instagram.com')" alt="icon">
            <div class="upload-btn-overlay">📁</div>
            <input type="file" accept="image/*" style="display:none" onchange="loadCustomIcon(event, this)">
          </div>
          <div>
            <div class="app-name" contenteditable="true" onblur="fetchLogo(this)">Instagram</div>
            <div class="app-time" contenteditable="true">10 hr, 14 min</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24">
            <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/>
          </svg>
        </div>
      </div>

    </div>
  </div>

  <div class="controls-panel">
    <strong>Bar Height Controls (Hours: 0h to 15h)</strong>
    <div class="graph-controls">
      <span>Sun: <input type="number" step="0.5" max="15" min="0" value="14.3" onchange="adjustBarByHours('bar-sun', this.value)">h</span>
      <span>Mon: <input type="number" step="0.5" max="15" min="0" value="7.2" onchange="adjustBarByHours('bar-mon', this.value)">h</span>
      <span>Tue: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-tue', this.value)">h</span>
      <span>Wed: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-wed', this.value)">h</span>
      <span>Thu: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-thu', this.value)">h</span>
      <span>Fri: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-fri', this.value)">h</span>
      <span>Sat: <input type="number" step="0.5" max="15" min="0" value="0" onchange="adjustBarByHours('bar-sat', this.value)">h</span>
    </div>
    <hr style="margin: 12px 0;">
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-add" onclick="addNewApp()">+ Add App</button>
      <button class="btn" onclick="exportImage()">Download Image</button>
    </div>
  </div>

  <script>
    const appMapping = {
      'freefire': 'ff.garena.com',
      'freefiremax': 'ff.garena.com',
      'bgmi': 'battlegroundsmobileindia.com',
      'pubg': 'pubgmobile.com',
      'telegram': 'telegram.org',
      'whatsapp': 'whatsapp.com',
      'snapchat': 'snapchat.com',
      'instagram': 'instagram.com',
      'youtube': 'youtube.com',
      'chrome': 'google.com',
      'facebook': 'facebook.com',
      'gallery': 'photos.google.com',
      'photos': 'photos.google.com'
    };

    function adjustBarByHours(barId, hoursVal) {
      let hours = parseFloat(hoursVal);
      if (isNaN(hours)) hours = 0;
      if (hours > 15) hours = 15;
      
      const percentage = (hours / 15) * 100;
      document.getElementById(barId).style.height = percentage + '%';
    }

    function fetchLogo(element) {
      let text = element.innerText.trim().toLowerCase();
      let cleanKey = text.replace(/[^a-z0-9]/g, '');
      const wrapper = element.closest('.app-left').querySelector('.app-icon-wrapper');
      const img = wrapper.querySelector('.app-icon');

      if (!cleanKey) return;

      let domain = appMapping[cleanKey] || (cleanKey + '.com');
      
      img.src = `https://unavatar.io/${domain}`;
      img.setAttribute('data-domain', domain);
    }

    function fallbackLogo(img, domain) {
      if(!domain) domain = img.getAttribute('data-domain') || 'google.com';
      img.onerror = function() {
        this.onerror = null;
        this.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
      };
      img.src = `https://logo.clearbit.com/${domain}`;
    }

    function triggerFileInput(wrapper) {
      wrapper.querySelector('input[type="file"]').click();
    }

    function loadCustomIcon(event, input) {
      event.stopPropagation();
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = input.previousElementSibling.previousElementSibling;
          img.src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }

    function addNewApp() {
      const container = document.getElementById('appList');
      const div = document.createElement('div');
      div.className = 'app-item';
      div.innerHTML = `
        <div class="app-left">
          <div class="app-icon-wrapper" onclick="triggerFileInput(this)" title="Click to Upload Custom Logo">
            <img class="app-icon" src="https://unavatar.io/google.com" onerror="fallbackLogo(this, 'google.com')" alt="icon">
            <div class="upload-btn-overlay">📁</div>
            <input type="file" accept="image/*" style="display:none" onchange="loadCustomIcon(event, this)">
          </div>
          <div>
            <div class="app-name" contenteditable="true" onblur="fetchLogo(this)">App Name</div>
            <div class="app-time" contenteditable="true">0 minutes</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24">
            <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/>
          </svg>
        </div>
      `;
      container.appendChild(div);
    }

    function exportImage() {
      const area = document.getElementById('captureArea');
      
      // Hide upload overlay while capturing screenshot
      const overlays = document.querySelectorAll('.upload-btn-overlay');
      overlays.forEach(o => o.style.display = 'none');

      html2canvas(area, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'screen-time-dashboard.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        overlays.forEach(o => o.style.display = '');
      });
    }
  </script>

</body>
</html>
