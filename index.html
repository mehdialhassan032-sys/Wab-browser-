<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Crop Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Styling wahi rakhi hai jo aapko pasand hai, logic upgrade kiya hai */
    body { font-family: sans-serif; background: #e5e7eb; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .phone-screen { width: 360px; background: #fff; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .controls-panel { margin-top: 20px; width: 360px; background: #fff; padding: 16px; border-radius: 8px; }
    .btn { background: #3b73ff; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
    .app-icon { width: 40px; height: 40px; object-fit: contain; }
    .crop-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; }
    .crop-container { width: 300px; height: 300px; background: #000; }
  </style>
</head>
<body>

  <div class="phone-screen" id="captureArea">
    <div class="app-item">
      <div class="app-icon-frame">
        <img class="app-icon" id="img-0" src="https://unavatar.io/instagram.com" alt="icon">
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div style="margin-bottom: 15px;">
      <label><b>AI Auto Crop Logo:</b></label>
      <input type="checkbox" id="aiToggle" checked>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(event, 'img-0')">
  </div>

  <div class="crop-modal" id="cropModal">
    <div class="crop-container"><img id="cropperImage" style="max-width: 100%;"></div>
    <button class="btn" onclick="applyManualCrop()">Done</button>
  </div>

  <script>
    let cropper = null;
    let activeImgId = null;

    // --- SMART PIXEL AUTO-CROP LOGIC ---
    function processImage(event, imgId) {
      const file = event.target.files[0];
      activeImgId = imgId;
      
      if (document.getElementById('aiToggle').checked) {
        // Auto Crop Mode
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            // Draw to hidden canvas to scan pixels
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
            let found = false;

            // Scan pixels to find NON-EMPTY area
            for (let y = 0; y < canvas.height; y++) {
              for (let x = 0; x < canvas.width; x++) {
                const i = (y * canvas.width + x) * 4;
                // Check if pixel is not transparent and not white (assuming white background)
                if (data[i+3] > 10 && (data[i] < 240 || data[i+1] < 240 || data[i+2] < 240)) {
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                  found = true;
                }
              }
            }

            if (!found) { alert("Logo detect nahi hua, manual crop karein."); openManual(e.target.result); return; }

            // Add padding to crop
            const padding = 10;
            minX = Math.max(0, minX - padding);
            maxX = Math.min(canvas.width, maxX + padding);
            minY = Math.max(0, minY - padding);
            maxY = Math.min(canvas.height, maxY + padding);

            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 128; finalCanvas.height = 128;
            finalCanvas.getContext('2d').drawImage(img, minX, minY, maxX-minX, maxY-minY, 0, 0, 128, 128);
            document.getElementById(imgId).src = finalCanvas.toDataURL();
          };
        };
        reader.readAsDataURL(file);
      } else {
        // Manual Mode
        const reader = new FileReader();
        reader.onload = (e) => openManual(e.target.result);
        reader.readAsDataURL(file);
      }
    }

    function openManual(src) {
      document.getElementById('cropModal').style.display = 'flex';
      const img = document.getElementById('cropperImage');
      img.src = src;
      if(cropper) cropper.destroy();
      cropper = new Cropper(img, { aspectRatio: 1 });
    }

    function applyManualCrop() {
      document.getElementById(activeImgId).src = cropper.getCroppedCanvas().toDataURL();
      document.getElementById('cropModal').style.display = 'none';
      cropper.destroy();
    }
  </script>
</body>
</html>
