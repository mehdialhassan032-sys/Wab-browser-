<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Time Customizable Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Roboto', -apple-system, sans-serif;
      background-color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    /* Screen Frame (Square/Sharp 4 Corners) */
    .phone-screen {
      width: 360px;
      background: #fafafd;
      padding: 12px 16px 24px 16px;
      border-radius: 0px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      box-sizing: border-box;
      color: #1a1a1a;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      margin-bottom: 24px;
    }

    .center-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      background: #e2e7ff;
      color: #3b488b;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .total-time {
      font-size: 34px;
      font-weight: 400;
    }

    .sub-title {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    /* Chart Layout */
    .chart-container {
      position: relative;
      height: 130px;
      margin: 20px 0 10px 0;
      display: flex;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 9px;
      color: #888;
      position: absolute;
      right: 0;
      top: 0;
      bottom: 20px;
      text-align: right;
    }

    .chart-grid {
      width: 100%;
      height: 100px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 25px;
      background: linear-gradient(to bottom, 
        transparent 0%, transparent 24%, 
        #f0f0f5 25%, transparent 26%,
        transparent 49%, #f0f0f5 50%, transparent 51%,
        transparent 74%, #f0f0f5 75%, transparent 76%);
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 11%;
      height: 100%;
      justify-content: flex-end;
      position: relative;
    }

    .bar {
      width: 100%;
      background-color: #c7d9ff;
      transition: height 0.2s ease;
    }

    .bar.active {
      background-color: #2962ff;
    }

    .bar-day {
      font-size: 10px;
      color: #666;
      margin-top: 6px;
      position: absolute;
      bottom: -18px;
    }

    .date-selector {
      text-align: center;
      font-size: 14px;
      margin: 28px 0 16px 0;
      color: #333;
    }

    /* App Item List with Hourglass Icon */
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .app-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .app-name {
      font-size: 15px;
      font-weight: 400;
    }

    .app-time {
      font-size: 12px;
      color: #666;
    }

    .app-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .divider {
      width: 1px;
      height: 24px;
      background-color: #e0e0e0;
    }

    /* Android Hourglass Icon */
    .hourglass-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #333333;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [contenteditable="true"] { outline: none; }
    [contenteditable="true"]:focus { background-color: #f0f4ff; }

    /* Control Panel Outside Preview Area */
    .controls-panel {
      margin-top: 20px;
      width: 360px;
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .btn {
      background: #2962ff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add { background: #2e7d32; }
    .btn-danger { background: #d32f2f; padding: 4px 8px; font-size: 11px; }
    .btn-move { background: #555; padding: 4px 8px; font-size: 11px; }

    .graph-controls {
      display: flex;
      gap: 4px;
      justify-content: space-between;
      margin-top: 10px;
    }
    .graph-controls input {
      width: 35px;
    }
  </style>
</head>
<body>

  <!-- Screen Content Area -->
  <div class="phone-screen" id="captureArea">
    <div class="top-bar">
      <span contenteditable="true">2:14</span>
      <span contenteditable="true">VoLTE 99%</span>
    </div>

    <div class="header-nav">
      <span>←</span>
      <span style="font-size: 16px;" contenteditable="true">⋮</span>
    </div>

    <div style="font-size: 22px; margin-bottom: 20px;" contenteditable="true">App activity details</div>

    <div class="center-info">
      <div class="badge" contenteditable="true">Screen time ▼</div>
      <div class="total-time" contenteditable="true">6 hr, 59 min</div>
      <div class="sub-title" contenteditable="true">Today</div>
    </div>

    <!-- Interactive Bar Graph -->
    <div class="chart-container">
      <div class="chart-grid">
        <div class="bar-col"><div class="bar" id="bar-sun" style="height: 85%;"></div><span class="bar-day" contenteditable="true">Sun</span></div>
        <div class="bar-col"><div class="bar active" id="bar-mon" style="height: 48%;"></div><span class="bar-day" contenteditable="true">Mon</span></div>
        <div class="bar-col"><div class="bar" id="bar-tue" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Tue</span></div>
        <div class="bar-col"><div class="bar" id="bar-wed" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Wed</span></div>
        <div class="bar-col"><div class="bar" id="bar-thu" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Thu</span></div>
        <div class="bar-col"><div class="bar" id="bar-fri" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Fri</span></div>
        <div class="bar-col"><div class="bar" id="bar-sat" style="height: 0%;"></div><span class="bar-day" contenteditable="true">Sat</span></div>
      </div>
      <div class="y-axis">
        <span>15h</span>
        <span>12h</span>
        <span>9h</span>
        <span>6h</span>
        <span>3h</span>
        <span>0h</span>
      </div>
    </div>

    <div class="date-selector" contenteditable="true">‹ &nbsp;&nbsp;&nbsp;&nbsp; Mon, Aug 17 &nbsp;&nbsp;&nbsp;&nbsp; ›</div>

    <!-- App Activity List -->
    <div class="app-list" id="appList">
      
      <div class="app-item">
        <div class="app-left">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=instagram.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="fetchLogo(this)">Instagram</div>
            <div class="app-time" contenteditable="true">1 hr, 46 min</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24">
            <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/>
          </svg>
        </div>
      </div>

      <div class="app-item">
        <div class="app-left">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="fetchLogo(this)">YouTube</div>
            <div class="app-time" contenteditable="true">1 hr, 44 min</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24">
            <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/>
          </svg>
        </div>
      </div>

    </div>
  </div>

  <!-- External Controls Panel -->
  <div class="controls-panel">
    <strong>Bar Height Controls (%)</strong>
    <div class="graph-controls">
      <span>Sun:<input type="number" value="85" onchange="adjustBar('bar-sun', this.value)"></span>
      <span>Mon:<input type="number" value="48" onchange="adjustBar('bar-mon', this.value)"></span>
      <span>Tue:<input type="number" value="0" onchange="adjustBar('bar-tue', this.value)"></span>
      <span>Wed:<input type="number" value="0" onchange="adjustBar('bar-wed', this.value)"></span>
    </div>
    <hr style="margin: 12px 0;">
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-add" onclick="addNewApp()">+ Add App</button>
      <button class="btn" onclick="exportImage()">Download Image</button>
    </div>
  </div>

  <script>
    // Adjust Graph Bar Heights dynamically
    function adjustBar(barId, val) {
      document.getElementById(barId).style.height = val + '%';
    }

    // Auto Logo Fetcher
    function fetchLogo(element) {
      const name = element.innerText.trim().toLowerCase().replace(/\s+/g, '');
      const img = element.closest('.app-left').querySelector('.app-icon');
      if (name) {
        img.src = `https://www.google.com/s2/favicons?domain=${name}.com&sz=64`;
      }
    }

    // Add New App Item with Controls
    function addNewApp() {
      const container = document.getElementById('appList');
      const div = document.createElement('div');
      div.className = 'app-item';
      div.innerHTML = `
        <div class="app-left">
          <img class="app-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt="icon">
          <div>
            <div class="app-name" contenteditable="true" onblur="fetchLogo(this)">App Name</div>
            <div class="app-time" contenteditable="true">0 min</div>
          </div>
        </div>
        <div class="app-right">
          <div class="divider"></div>
          <svg class="hourglass-icon" viewBox="0 0 24 24">
            <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"/>
          </svg>
        </div>
      `;
      container.appendChild(div);
    }

    // Export Canvas Image
    function exportImage() {
      const area = document.getElementById('captureArea');
      html2canvas(area, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'app-activity-details.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>

</body>
</html>
